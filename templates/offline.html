<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONNECT — You're Offline</title>
    <meta name="theme-color" content="#764ba2">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 24px;
        }

        .card {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 20px;
            padding: 48px 36px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        }

        .icon-wrap {
            width: 96px;
            height: 96px;
            background: rgba(255,255,255,0.18);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
        }

        .icon-wrap svg {
            width: 48px;
            height: 48px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .brand {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.75;
            margin-bottom: 28px;
        }

        p {
            font-size: 1rem;
            opacity: 0.88;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .tips {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 24px 0;
            text-align: left;
        }

        .tips p {
            font-size: 0.875rem;
            margin-bottom: 6px;
            opacity: 0.85;
        }

        .tips p:last-child { margin-bottom: 0; }

        .tips p::before {
            content: '•';
            margin-right: 8px;
            opacity: 0.6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: #764ba2;
            border: none;
            border-radius: 12px;
            padding: 13px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s, box-shadow 0.15s;
            margin-top: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            color: #764ba2;
        }

        .btn:active { transform: translateY(0); }

        .status {
            margin-top: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        #onlineStatus {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f87171;
            display: inline-block;
        }

        .dot.online { background: #4ade80; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">
            <!-- Wifi-off icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>

        <div class="brand">CONNECT</div>
        <h1>You're Offline</h1>
        <p>No internet connection detected.</p>
        <p>Some pages may still be available from cache.</p>

        <div class="tips">
            <p>Check your Wi-Fi or mobile data</p>
            <p>Make sure airplane mode is off</p>
            <p>Move closer to your router</p>
        </div>

        <button class="btn" onclick="tryReconnect()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
            </svg>
            Try Again
        </button>

        <div class="status">
            <span id="onlineStatus">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Offline</span>
            </span>
        </div>
    </div>

    <script>
        function updateStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (navigator.onLine) {
                dot.classList.add('online');
                text.textContent = 'Connection restored!';
                setTimeout(() => { window.location.href = '/dashboard'; }, 1200);
            } else {
                dot.classList.remove('online');
                text.textContent = 'Offline';
            }
        }

        function tryReconnect() {
            const btn = document.querySelector('.btn');
            btn.textContent = 'Checking…';
            btn.style.opacity = '0.75';
            setTimeout(() => {
                if (navigator.onLine) {
                    window.location.href = '/dashboard';
                } else {
                    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg> Try Again';
                    btn.style.opacity = '1';
                }
            }, 1500);
        }

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
    </script>
</body>
</html>
